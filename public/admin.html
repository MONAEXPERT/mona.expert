<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — mona.expert</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg>️</text></svg>">
<style>
  :root {
    --bg: #0b0b0f; --surface: #14141a; --surface2: #1c1c24;
    --border: #2a2a35; --text: #e8e8ed; --muted: #7a7a8a;
    --primary: #6c5ce7; --green: #22c55e; --red: #ef4444; --orange: #f59e0b;
    --radius: 12px; --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); min-height: 100vh; }

  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
  .badge { display: inline-block; font-size: .7rem; font-weight: 600; padding: .2em .6em; border-radius: 999px; text-transform: uppercase; }
  .badge-admin { background: var(--primary); color: #fff; }
  .badge-user { background: var(--border); color: var(--muted); }
  .badge-success { background: var(--green); color: #000; }
  .badge-error { background: var(--red); color: #fff; }

  .tabs { display: flex; gap: .25rem; margin-bottom: 1.5rem; background: var(--surface); border-radius: var(--radius); padding: .25rem; }
  .tab { padding: .5rem 1.25rem; border-radius: var(--radius-sm); cursor: pointer; border: none; background: none; color: var(--muted); font-size: .85rem; font-weight: 500; transition: .15s; }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { background: var(--primary); color: #fff; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .04em; }

  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; padding: .6rem .75rem; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
  td { padding: .6rem .75rem; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--surface2); }

  .role-select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .2rem .4rem; font-size: .8rem; cursor: pointer; }
  .btn { padding: .35rem .75rem; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: .8rem; font-weight: 500; transition: .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { filter: brightness(1.15); }
  .btn-sm { padding: .2rem .5rem; font-size: .75rem; }

  .sys-log { max-height: 500px; overflow-y: auto; }
  .sys-entry { display: flex; align-items: flex-start; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
  .sys-entry:last-child { border-bottom: none; }
  .sys-time { font-family: monospace; font-size: .75rem; color: var(--muted); min-width: 8em; white-space: nowrap; }
  .sys-user { font-size: .75rem; color: var(--muted); min-width: 10em; }
  .sys-action { flex: 1; }
  .sys-details { font-size: .75rem; color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sys-status { font-size: .75rem; min-width: 4em; text-align: right; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
  .stat-card .num { font-size: 1.8rem; font-weight: 700; }
  .stat-card .label { font-size: .75rem; color: var(--muted); margin-top: .15rem; }

  .mono { font-family: monospace; font-size: .8rem; }

  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: .75rem 1.25rem; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: .85rem; font-weight: 500; opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty { text-align: center; padding: 2rem; color: var(--muted); font-size: .9rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg>️ Admin-Panel <span class="badge badge-admin">Admin</span></h1>
    <div>
      <span id="userInfo" style="color:var(--muted);font-size:.85rem"></span>
      <a href="dashboard.html" style="margin-left:1rem;color:var(--primary);font-size:.85rem"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg> Dashboard</a>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Übersicht</button>
    <button class="tab" data-tab="users">Benutzer</button>
    <button class="tab" data-tab="system">System-Log</button>
  </div>

  <div id="tab-overview" class="tab-content">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <div class="card-title"><svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg> Letzte System-Ereignisse</div>
      <div id="recentEvents" class="sys-log"></div>
    </div>
  </div>

  <div id="tab-users" class="tab-content hidden">
    <div class="card">
      <div class="card-title"><svg class="ico" aria-hidden="true"><use href="#i-users"/></svg> Alle Benutzer</div>
      <table id="usersTable">
        <thead>
          <tr><th>ID</th><th>E-Mail</th><th>Name</th><th>Plan</th><th>Rolle</th><th>Erstellt</th><th>Letzter Login</th><th>Aktion</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-system" class="tab-content hidden">
    <div class="card">
      <div class="card-title"><svg class="ico" aria-hidden="true"><use href="#i-clipboard"/></svg> System-weites Audit-Log</div>
      <div id="systemLog" class="sys-log"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api.php';
let token = localStorage.mx_token;
let user = null;

async function api(action, data = {}) {
  const res = await fetch(`${API}?action=${action}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
    body: JSON.stringify(data),
  });
  return res.json();
}

function showToast(msg, cls = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function init() {
  // Check auth
  const me = await api('me');
  if (me.status !== 'ok' || me.user.role !== 'admin') {
    document.body.innerHTML = `<div class="container"><div class="card" style="text-align:center;padding:3rem"><h2><svg class="ico" aria-hidden="true"><use href="#i-ban"/></svg> Zugriff verweigert</h2><p style="color:var(--muted);margin-top:.5rem">Nur für Admins.</p><a href="dashboard.html" style="color:var(--primary)"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg> zurück zum Dashboard</a></div></div>`;
    return;
  }
  user = me.user;
  document.getElementById('userInfo').textContent = user.email;

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
    });
  });

  loadOverview();
  loadUsers();
  loadSystemLog();
}

async function loadOverview() {
  const [sysLog, stats] = await Promise.all([
    api('admin_system_log', { limit: 10 }),
    api('get_audit_stats'),
  ]);

  const total = stats.status === 'ok' ? stats.summary?.total_events || 0 : 0;
  const today = stats.status === 'ok' ? (stats.daily?.[0]?.total || 0) : 0;
  const errors = stats.status === 'ok' ? (stats.summary?.total_errors || 0) : 0;
  const injections = stats.status === 'ok' ? (stats.summary?.injection_attempts || 0) : 0;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Ereignisse gesamt</div></div>
    <div class="stat-card"><div class="num">${today}</div><div class="label">Heute</div></div>
    <div class="stat-card"><div class="num" style="color:${errors > 0 ? 'var(--red)' : 'var(--green)'}">${errors}</div><div class="label">Fehler</div></div>
    <div class="stat-card"><div class="num">${injections}</div><div class="label">Injection-Versuche</div></div>
  `;

  const cont = document.getElementById('recentEvents');
  if (sysLog.status !== 'ok' || !sysLog.log?.length) {
    cont.innerHTML = '<div class="empty">Keine Ereignisse</div>'; return;
  }
  cont.innerHTML = sysLog.log.slice(0, 10).map(e => `
    <div class="sys-entry">
      <span class="sys-time">${e.created_at}</span>
      <span class="sys-user">${e.user_email || '—'}</span>
      <span class="sys-action"><span class="badge ${e.status === 'success' ? 'badge-success' : 'badge-error'}">${e.event_type}/${e.action}</span></span>
      <span class="sys-details" title="${e.details ? (e.details.message || JSON.stringify(e.details).slice(0,100)) : ''}">${e.details ? (e.details.message || JSON.stringify(e.details).slice(0,80)) : ''}</span>
    </div>
  `).join('');
}

async function loadUsers() {
  const res = await api('admin_list_users');
  if (res.status !== 'ok') { document.getElementById('usersBody').innerHTML = '<tr><td colspan="8"><div class="empty">Fehler beim Laden</div></td></tr>'; return; }
  document.getElementById('usersBody').innerHTML = res.users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td class="mono">${u.email}</td>
      <td>${u.display_name || '—'}</td>
      <td><span class="badge ${u.plan_type === 'pro' ? 'badge-success' : ''}">${u.plan_type || 'free'}</span></td>
      <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role || 'user'}</span></td>
      <td style="font-size:.8rem;color:var(--muted)">${u.created_at ? new Date(u.created_at).toLocaleDateString('de-DE') : '—'}</td>
      <td style="font-size:.8rem;color:var(--muted)">${u.last_login ? new Date(u.last_login).toLocaleString('de-DE') : '—'}</td>
      <td>
        <select class="role-select" data-uid="${u.id}" onchange="updateUserRole(${u.id}, this.value)">
          <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
        </select>
      </td>
    </tr>
  `).join('');
}

async function updateUserRole(uid, role) {
  const res = await api('admin_update_user', { user_id: uid, role });
  if (res.status === 'ok') {
    showToast(`<svg class="ico ico-success" aria-hidden="true"><use href="#i-check"/></svg> User #${uid} <svg class="ico" aria-hidden="true"><use href="#i-arrow-right"/></svg> ${role}`);
    loadUsers();
  } else {
    showToast(`<svg class="ico ico-danger" aria-hidden="true"><use href="#i-x"/></svg> ${res.message}`, 'error');
  }
}

async function loadSystemLog() {
  const res = await api('admin_system_log', { limit: 100 });
  const cont = document.getElementById('systemLog');
  if (res.status !== 'ok' || !res.log?.length) {
    cont.innerHTML = '<div class="empty">Keine Ereignisse</div>'; return;
  }
  cont.innerHTML = res.log.map(e => `
    <div class="sys-entry">
      <span class="sys-time">${e.created_at}</span>
      <span class="sys-user">${e.user_email || '—'}</span>
      <span class="sys-action">
        <span class="badge ${e.status === 'success' ? 'badge-success' : 'badge-error'}">${e.event_type}</span>
        ${e.action}
      </span>
      <span class="sys-details" title="${e.details ? JSON.stringify(e.details).slice(0,200) : ''}">
        ${e.details ? (e.details.message || JSON.stringify(e.details).slice(0,100)) : ''}
      </span>
      <span class="sys-status" style="color:${e.status === 'success' ? 'var(--green)' : 'var(--red)'}">${e.status}</span>
    </div>
  `).join('');
}

// Auto-refresh overview every 15s
setInterval(loadOverview, 15000);

init();
</script>
</body>
</html>
