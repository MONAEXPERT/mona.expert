<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Marketplace — mona.expert</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .agent-card {
      background: var(--bg-card, #1c1e26);
      border: 1px solid var(--border, #2e303a);
      border-radius: 12px;
      padding: 1.5rem;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .agent-card:hover {
      border-color: var(--accent, #7c5cfc);
      transform: translateY(-1px);
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .agent-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text, #e0e0e0);
      margin: 0;
    }
    .agent-tagline {
      color: var(--text-dim, #888);
      font-size: 0.85rem;
      margin: 0.15rem 0 0.5rem 0;
    }

    .agent-description {
      color: var(--text-dim, #999);
      font-size: 0.85rem;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 1rem;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge-provider {
      background: rgba(124, 92, 252, 0.15);
      color: #7c5cfc;
      border: 1px solid rgba(124, 92, 252, 0.25);
    }
    .badge-installed {
      background: rgba(0, 200, 83, 0.15);
      color: #00c853;
      border: 1px solid rgba(0, 200, 83, 0.25);
    }
    .badge-running {
      background: rgba(0, 184, 212, 0.15);
      color: #00b8d4;
      border: 1px solid rgba(0, 184, 212, 0.3);
      animation: pulse-status 1.5s ease-in-out infinite;
    }
    .badge-stopped {
      background: rgba(255, 152, 0, 0.15);
      color: #ff9800;
      border: 1px solid rgba(255, 152, 0, 0.25);
    }
    .badge-error {
      background: rgba(255, 23, 68, 0.15);
      color: #ff1744;
      border: 1px solid rgba(255, 23, 68, 0.25);
    }
    .badge-not-installed {
      background: rgba(158, 158, 158, 0.12);
      color: #9e9e9e;
      border: 1px solid rgba(158, 158, 158, 0.2);
    }
    .badge-safety-green {
      background: rgba(0, 200, 83, 0.12);
      color: #00c853;
    }
    .badge-safety-amber {
      background: rgba(255, 152, 0, 0.15);
      color: #ff9800;
    }
    .badge-safety-red {
      background: rgba(255, 23, 68, 0.15);
      color: #ff1744;
    }
    .badge-safety-unknown {
      background: rgba(158, 158, 158, 0.12);
      color: #9e9e9e;
    }

    @keyframes pulse-status {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .agent-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .agent-permissions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .perm-tag {
      font-size: 0.72rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      color: var(--text-dim, #999);
    }
    .perm-tag.enabled {
      color: #00c853;
    }
    .perm-tag.disabled {
      color: #666;
      text-decoration: line-through;
    }

    .agent-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.5rem 0;
    }
    .tag {
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-dim, #888);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .agent-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border, #2e303a);
    }

    .btn {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent, #7c5cfc);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #6a4be0;
    }
    .btn-danger {
      background: rgba(255, 23, 68, 0.15);
      color: #ff1744;
      border-color: rgba(255, 23, 68, 0.3);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(255, 23, 68, 0.25);
    }
    .btn-outline {
      background: transparent;
      color: var(--text, #ccc);
      border-color: var(--border, #2e303a);
    }
    .btn-outline:hover:not(:disabled) {
      background: rgba(255,255,255,0.05);
    }
    .btn-start {
      background: rgba(0, 200, 83, 0.15);
      color: #00c853;
      border-color: rgba(0, 200, 83, 0.3);
    }
    .btn-start:hover:not(:disabled) {
      background: rgba(0, 200, 83, 0.25);
    }
    .btn-stop {
      background: rgba(255, 152, 0, 0.15);
      color: #ff9800;
      border-color: rgba(255, 152, 0, 0.3);
    }
    .btn-stop:hover:not(:disabled) {
      background: rgba(255, 152, 0, 0.25);
    }
    .btn-install {
      background: rgba(0, 184, 212, 0.15);
      color: #00b8d4;
      border-color: rgba(0, 184, 212, 0.3);
    }
    .btn-install:hover:not(:disabled) {
      background: rgba(0, 184, 212, 0.25);
    }

    .agent-actions .spacer {
      flex: 1;
    }

    .provider-link {
      color: var(--accent, #7c5cfc);
      font-size: 0.8rem;
      text-decoration: none;
    }
    .provider-link:hover {
      text-decoration: underline;
    }

    .filters {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin: 1rem 0 0 0;
    }
    .filter-btn {
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.04);
      color: var(--text-dim, #888);
      border: 1px solid var(--border, #2e303a);
      cursor: pointer;
      transition: all 0.12s;
    }
    .filter-btn.active {
      background: var(--accent, #7c5cfc);
      color: #fff;
      border-color: var(--accent, #7c5cfc);
    }
    .filter-btn:hover:not(.active) {
      background: rgba(255,255,255,0.08);
    }

    .summary-bar {
      display: flex;
      gap: 1.5rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border, #2e303a);
      margin-bottom: 0.25rem;
    }
    .summary-stat {
      font-size: 0.8rem;
    }
    .summary-stat strong {
      color: var(--text, #e0e0e0);
      font-size: 0.9rem;
    }
    .summary-stat span {
      color: var(--text-dim, #888);
    }

    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim, #888);
    }
    .loading-state .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border, #2e303a);
      border-top-color: var(--accent, #7c5cfc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim, #888);
    }
    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      background: #1c1e26;
      border: 1px solid var(--border, #2e303a);
      color: var(--text, #e0e0e0);
      font-size: 0.85rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 100;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.error {
      border-color: rgba(255,23,68,0.4);
    }
    .toast.success {
      border-color: rgba(0,200,83,0.4);
    }
  </style>
</head>

  <main class="main-content">
    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
      <h1 style="margin:0;">Agent Marketplace</h1>
      <p style="color: var(--text-dim, #888); margin-top: 0.25rem;">Browse, install, and manage AI agents. Mona contains and audits every agent.</p>

      <div class="summary-bar" id="summary"></div>

      <div class="filters" id="filterBar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="installed">Installed</button>
        <button class="filter-btn" data-filter="running">Running</button>
        <button class="filter-btn" data-filter="not_installed">Available</button>
        <span style="flex:1"></span>
        <span id="lastUpdated" style="font-size:0.75rem; color:var(--text-dim,#555);"></span>
      </div>

      <div id="agentsContainer">
        <div class="loading-state">
          <div class="spinner"></div>
          <div>Loading agents…</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module">
    const AGENTS_API = '/api/agents';

    let agents = [];
    let filter = 'all';
    let eventSource = null;

    const container = document.getElementById('agentsContainer');
    const summaryEl = document.getElementById('summary');
    const toastEl = document.getElementById('toast');

    function showToast(message, type = 'success') {
      toastEl.textContent = message;
      toastEl.className = `toast ${type} show`;
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    function statusBadgeHtml(status) {
      const cls = status === 'running' ? 'badge-running'
        : status === 'installed' ? 'badge-installed'
        : status === 'stopped' ? 'badge-stopped'
        : status === 'error' ? 'badge-error'
        : 'badge-not-installed';
      return `<span class="badge ${cls}">${status.replace('_', ' ')}</span>`;
    }

    function safetyBadgeHtml(rating) {
      const cls = `badge-safety-${rating || 'unknown'}`;
      return `<span class="badge ${cls}">${rating || 'unknown'}</span>`;
    }

    function permHtml(val) { return val ? '<svg class="ico ico-success" aria-hidden="true"><use href="#i-check"/></svg>' : '<svg class="ico ico-danger" aria-hidden="true"><use href="#i-x"/></svg>'; }

    function renderAgents() {
      const filtered = filter === 'all' ? agents
        : filter === 'installed' ? agents.filter(a => a.installed)
        : filter === 'running' ? agents.filter(a => a.status === 'running')
        : filter === 'not_installed' ? agents.filter(a => !a.installed)
        : agents;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon"><svg class="ico" aria-hidden="true"><use href="#i-package"/></svg></div>
            <div>No agents match this filter.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(agent => `
        <div class="agent-card">
          <div class="agent-header">
            <div>
              <h3 class="agent-name">${escHtml(agent.name)}</h3>
              <p class="agent-tagline">${escHtml(agent.tagline || '')}</p>
            </div>
            ${statusBadgeHtml(agent.status || 'not_installed')}
          </div>

          <p class="agent-description">${escHtml(agent.description || 'No description')}</p>

          <div class="agent-meta">
            <span class="badge badge-provider">${agent.provider?.name || 'Unknown'}</span>
            ${safetyBadgeHtml(agent.safety?.rating)}
            ${agent.installed ? `<span class="badge badge-installed">v${agent.version || '?'}</span>` : ''}
          </div>

          <div class="agent-permissions">
            <span class="perm-tag ${agent.permissions?.files?.read ? 'enabled' : 'disabled'}">files.read ${permHtml(agent.permissions?.files?.read)}</span>
            <span class="perm-tag ${agent.permissions?.files?.write ? 'enabled' : 'disabled'}">files.write ${permHtml(agent.permissions?.files?.write)}</span>
            <span class="perm-tag ${agent.permissions?.shell ? 'enabled' : 'disabled'}">shell ${permHtml(agent.permissions?.shell)}</span>
            <span class="perm-tag ${agent.permissions?.network?.outbound ? 'enabled' : 'disabled'}">net.out ${permHtml(agent.permissions?.network?.outbound)}</span>
          </div>

          <div class="agent-tags">
            ${(agent.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
          </div>

          <div class="agent-actions">
            ${!agent.installed ? `
              <button class="btn btn-install" onclick="doAction('${agent.id}','install')">Install</button>
            ` : `
              <button class="btn btn-start" onclick="doAction('${agent.id}','start')" ${agent.status === 'running' ? 'disabled' : ''}>Start</button>
              <button class="btn btn-stop" onclick="doAction('${agent.id}','stop')" ${agent.status !== 'running' ? 'disabled' : ''}>Stop</button>
              <span class="spacer"></span>
              <button class="btn btn-danger" onclick="doAction('${agent.id}','uninstall')">Uninstall</button>
            `}
          </div>
        </div>
      `).join('');
    }

    function renderSummary() {
      const total = agents.length;
      const installed = agents.filter(a => a.installed).length;
      const running = agents.filter(a => a.status === 'running').length;
      summaryEl.innerHTML = `
        <div class="summary-stat"><strong>${total}</strong> <span>agents</span></div>
        <div class="summary-stat"><strong>${installed}</strong> <span>installed</span></div>
        <div class="summary-stat"><strong>${running}</strong> <span>running</span></div>
      `;
    }

    function escHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadAgents() {
      try {
        const res = await fetch(AGENTS_API);
        const data = await res.json();
        if (data.ok && Array.isArray(data.agents)) {
          agents = data.agents;
        } else {
          agents = [];
        }
      } catch (err) {
        agents = [];
        console.error('Failed to load agents:', err);
      }
      renderSummary();
      renderAgents();
      document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
    }

    window.doAction = async function(agentId, action) {
      const card = event?.target?.closest?.('.agent-card');
      if (card) card.style.opacity = '0.6';

      try {
        const res = await fetch(`${AGENTS_API}/${agentId}/${action}`, { method: 'POST' });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Request failed');

        const msg = action === 'install' ? `Installed ${data.agent?.name || agentId}`
          : action === 'uninstall' ? `Uninstalled ${data.agent?.name || agentId}`
          : action === 'start' ? `Started ${agentId}`
          : action === 'stop' ? `Stopped ${agentId}`
          : `Done`;
        showToast(msg, 'success');

        await loadAgents();
      } catch (err) {
        showToast(err.message, 'error');
        console.error('Action failed:', err);
      }

      if (card) card.style.opacity = '1';
    };

    // Filter buttons
    document.getElementById('filterBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn || !btn.dataset.filter) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      renderAgents();
    });

    // SSE for live updates
    function connectSse() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/live');
      eventSource.addEventListener('ready', () => {});
      eventSource.addEventListener('agents-update', () => { loadAgents(); });
      eventSource.addEventListener('audit', () => { loadAgents(); });
      eventSource.addEventListener('heartbeat', () => {});
      eventSource.addEventListener('error', () => {
        eventSource.close();
        setTimeout(connectSse, 3000);
      });
    }

    // Init
    await loadAgents();
    connectSse();
  </script>
<footer>
    <div class="footer-content">
      <div class="footer-brand"><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg>️ mona.expert</div>
      <div class="footer-links">
        <a href="./">Home</a> · <a href="dashboard.html">Dashboard</a> · <a href="agents.html">Agents</a> · <a href="overview.html">Overview</a>
      </div>
      <span style="color:var(--text-muted); font-size:0.85rem;">Real-time AI agent security wrapper</span>
    </div>
  </footer>
</body>
</html>
